services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: arsenic_energies
      POSTGRES_USER: arsenic_user
      POSTGRES_PASSWORD: arsenic_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arsenic_user -d arsenic_energies"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
