<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop Arsenic Energies</title>
<meta name="description" content="Browse solar panels, inverters, batteries, solar kits, electrical products and electronics from Arsenic Energies.">
<link rel="icon" type="image/png" href="assets/images/brand/arsenic-energies-favicon.png">
<link rel="shortcut icon" href="assets/images/brand/favicon.ico">
<link rel="apple-touch-icon" href="assets/images/brand/arsenic-energies-favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="js/tailwind-config.js?v=20260911-brand-logo"></script>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="css/styles.css?v=20260911-brand-logo">
</head>
<body data-page="shop">
<a href="#main" class="skip-link">Skip to content</a>
<div data-site-header></div>

<main id="main" class="pt-32 lg:pt-40 pb-24 max-w-[1400px] mx-auto px-6 lg:px-10">
  <div class="mb-10">
    <p class="nameplate mb-4"><span class="dot"></span> CATALOG</p>
    <h1 class="font-display text-4xl lg:text-5xl">Shop all products</h1>
  </div>

  <div class="flex flex-col lg:flex-row gap-10">
    <!-- Filters -->
    <aside class="lg:w-64 flex-shrink-0 space-y-8">
      <div>
        <label for="search-input" class="sr-only">Search products</label>
        <div class="relative">
          <input id="search-input" type="search" placeholder="Search products..." class="w-full bg-transparent border rounded-md pl-10 pr-3 py-2.5 text-sm" style="border-color:var(--line)">
          <svg class="absolute left-3 top-1/2 -translate-y-1/2" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--muted-2)" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        </div>
      </div>

      <div>
        <p class="text-sm font-display mb-3" style="color:var(--muted-2)">Category</p>
        <div id="filter-category" class="space-y-2 text-sm"></div>
      </div>

      <div>
        <p class="text-sm font-display mb-3" style="color:var(--muted-2)">Price</p>
        <div class="space-y-2 text-sm" id="filter-price">
          <label class="flex items-center gap-2"><input type="radio" name="price" value="all" checked> Any price</label>
          <label class="flex items-center gap-2"><input type="radio" name="price" value="0-50"> Under $50</label>
          <label class="flex items-center gap-2"><input type="radio" name="price" value="50-300"> $50 – $300</label>
          <label class="flex items-center gap-2"><input type="radio" name="price" value="300-1000"> $300 – $1,000</label>
          <label class="flex items-center gap-2"><input type="radio" name="price" value="1000-99999"> $1,000+</label>
        </div>
      </div>

      <div>
        <p class="text-sm font-display mb-3" style="color:var(--muted-2)">Availability</p>
        <label class="flex items-center gap-2 text-sm"><input type="checkbox" id="filter-instock"> In stock only</label>
      </div>

      <div>
        <p class="text-sm font-display mb-3" style="color:var(--muted-2)">Rating</p>
        <div class="space-y-2 text-sm" id="filter-rating">
          <label class="flex items-center gap-2"><input type="radio" name="rating" value="0" checked> Any rating</label>
          <label class="flex items-center gap-2"><input type="radio" name="rating" value="4.5"> 4.5 &amp; up</label>
          <label class="flex items-center gap-2"><input type="radio" name="rating" value="4"> 4.0 &amp; up</label>
        </div>
      </div>

      <button id="clear-filters" class="text-sm underline underline-offset-4" style="color:var(--muted)">Clear all filters</button>
    </aside>

    <!-- Results -->
    <div class="flex-1">
      <div class="flex items-center justify-between mb-6">
        <p id="results-count" class="text-sm" style="color:var(--muted)">0 products</p>
        <select id="sort-select" class="bg-transparent border rounded-md px-3 py-2 text-sm" style="border-color:var(--line)">
          <option value="featured">Sort: Featured</option>
          <option value="price-asc">Price: Low to High</option>
          <option value="price-desc">Price: High to Low</option>
          <option value="rating">Highest Rated</option>
        </select>
      </div>
      <div id="product-grid" class="grid sm:grid-cols-2 xl:grid-cols-3 gap-5"></div>
      <div id="empty-state" class="hidden text-center py-24">
        <p class="font-display text-xl mb-2">No products match your filters</p>
        <p class="text-sm" style="color:var(--muted)">Try widening your price range or clearing a filter.</p>
      </div>
    </div>
  </div>
</main>

<div data-site-footer></div>
<div data-site-overlays></div>

<script src="js/data.js?v=20260911-brand-logo"></script>
<script src="js/utils.js?v=20260911-brand-logo"></script>
<script src="js/backend-config.js?v=20260911-brand-logo"></script>
<script src="js/backend-api.js?v=20260911-brand-logo"></script>
<script src="js/store.js?v=20260911-brand-logo"></script>
<script src="js/components.js?v=20260911-social-links"></script>
<script src="js/pages.js?v=20260911-brand-logo"></script>
<script src="js/main.js?v=20260911-brand-logo"></script>
</body>
</html>
